<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Shift</title>
<style>
:root{--bg:#0b0d12;--panel:#171b25;--line:#2b3244;--text:#eef1f7;--mute:#98a2b8;--acc:#ffc83d;--bad:#ff5468;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0f5;--panel:#fff;--line:#cfd5e3;--text:#151a26;--mute:#5a6479;--acc:#9a6a00;--bad:#c4263a;color-scheme:light}}
:root[data-theme="light"]{--bg:#eef0f5;--panel:#fff;--line:#cfd5e3;--text:#151a26;--mute:#5a6479;--acc:#9a6a00;--bad:#c4263a;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:500 17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.scr{max-width:560px;margin:0 auto;padding:24px 18px}
h1{font-size:2.6rem;line-height:1.05;margin:20px 0 12px;letter-spacing:-.02em}
p{margin:0 0 14px}.mute{color:var(--mute)}
button{font:inherit;font-weight:700;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;min-height:52px;width:100%;margin:0 0 10px;cursor:pointer}
button.pri{background:var(--acc);color:#111;border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
input{font:inherit;font-size:2rem;text-align:center;letter-spacing:.3em;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text);margin-bottom:12px}
#tv{max-width:none;padding:0;position:fixed;inset:0;background:#000}
#cv{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;color:#eef1f7;text-shadow:0 1px 4px #000}
#h1{position:absolute;left:3vw;top:3vh;font-size:clamp(14px,2.2vw,28px);font-weight:700}
#h2{position:absolute;left:0;right:0;bottom:4vh;text-align:center;font-size:clamp(14px,2vw,26px);padding:0 4vw}
#h2 b{font-size:clamp(20px,3.8vw,56px);display:block;letter-spacing:.04em;color:#ffc83d;margin:6px 0}
#area{height:52vh;min-height:260px;border-radius:20px;border:2px dashed var(--line);display:grid;place-items:center;touch-action:none;color:var(--text);font-size:1.35rem;font-weight:800;text-align:center;padding:12px;background:radial-gradient(circle at center,#2b3244,#11141c);margin-bottom:12px;user-select:none;-webkit-user-select:none}
#area small{display:block;font-size:.85rem;font-weight:500;color:var(--mute);margin-top:12px}\n#msg{background:var(--panel);border:2px solid var(--acc);border-radius:14px;padding:14px;margin-bottom:12px;font-weight:700}
</style>
</head>
<body>
<div class="scr">
 <div id="start"><h1>Controller</h1><p>Connect your phone and Android TV to the same Wi-Fi. Open the address shown on the TV, then tap start.</p><button id="go" class="pri">Tap to start</button></div>
 <div id="play" hidden>
  <div id="msg" hidden></div>
  <div id="area" role="application" aria-label="Aim control">DRAG TO AIM<br><small>Move your finger to point the flashlight</small></div>
  <button id="grab" class="pri">Grab</button>
  <button id="recenter">Recenter aim</button>
  <p id="st" class="mute" aria-live="polite"></p>
 </div>
</div>
<script>
const $=s=>document.querySelector(s),cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const MSG=['','Unknown: Don’t stop shining it. It hates the light.','Unknown: One more. It can hear the fuse box humming.','Unknown: Lights are up. You made it out.'];
let seen=false,ax=.5,ay=.5,gN=0,a0=null,b0=null,la=0,lb=0,lastEv=null,ac=null,tmr=0;
const area=$('#area');
addEventListener('deviceorientation',e=>{
 if(e.beta==null||e.alpha==null)return;
 seen=true;la=e.alpha;lb=e.beta;if(a0===null){a0=la;b0=lb}
 const da=((la-a0+540)%360)-180;ax=cl(.5-da/70);ay=cl(.5-(lb-b0)/50);
});
const mv=e=>{if(seen)return;const r=area.getBoundingClientRect();ax=cl((e.clientX-r.left)/r.width);ay=cl((e.clientY-r.top)/r.height)};
area.addEventListener('pointerdown',mv);area.addEventListener('pointermove',mv);
function ring(m){
 const box=$('#msg');box.textContent=m;box.hidden=false;
 if(navigator.vibrate)navigator.vibrate([250,120,250,120,250]);
 if(ac)[0,.35,.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.2)});
 clearTimeout(tmr);tmr=setTimeout(()=>{box.hidden=true},7000);
}
async function loop(){
 try{
  const j=await(await fetch('/pad?x='+ax.toFixed(3)+'&y='+ay.toFixed(3)+'&g='+gN,{cache:'no-store'})).json();
  $('#st').textContent='Fuses '+j.got+'/3';
  if(lastEv!==null&&j.ev>lastEv)ring(MSG[Math.min(3,j.got)]);
  lastEv=j.ev;
 }catch(e){$('#st').textContent='Can’t reach the TV. Same Wi-Fi?'}
 setTimeout(loop,60);
}
$('#go').onclick=async()=>{
 try{ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
 try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){}
 $('#start').hidden=true;$('#play').hidden=false;loop();
};
$('#grab').onclick=()=>{gN++;if(navigator.vibrate)navigator.vibrate(30)};
$('#recenter').onclick=()=>{a0=la;b0=lb};
</script>
</body>
</html>
